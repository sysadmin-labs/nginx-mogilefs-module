# The part of the reload test that differs per module.  ci/reload.sh sources
# this with $WORK and $PORT already set and then drives the reloads.
#
#     RELOAD_HTTP    directives for the http block, may be empty
#     RELOAD_SERVER  directives for the server block
#     RELOAD_EXPECT  what reload_probe has to print
#     reload_probe   prints what the server answered
#     reload_cleanup stops the tracker when the run ends

MOG_TRACKER_PORT=${MOG_TRACKER_PORT:-17001}
MOG_STORE_PORT=$((PORT + 1))

# A storage node for the probe to be redirected to, in the same nginx.
mkdir -p "$WORK/store/dev1/0/000/000"
printf 'reload-probe-body' > "$WORK/store/dev1/0/000/000/0000000001.fid"

RELOAD_HTTP="
    server {
        listen 127.0.0.1:$MOG_STORE_PORT;
        root $WORK/store;
    }"

RELOAD_SERVER="
        location /probe/ {
            mogilefs_tracker 127.0.0.1:$MOG_TRACKER_PORT;
            mogilefs_domain  test;
            mogilefs_read_timeout 2s;

            mogilefs_pass {
                proxy_pass \$mogilefs_path;
                proxy_hide_header Content-Type;
            }
        }"

# The body only reaches the client if the module asked the tracker, got a
# path back, set $mogilefs_path and redirected to it.  A reload that left
# the module with stale per-cycle state would still answer -- with
# something else, or with 502 -- so the probe asks what the module did and
# not whether the server is up.
RELOAD_EXPECT='reload-probe-body'

_mog_src=$(cd "$(dirname "$0")/.." && pwd)
perl "$_mog_src/t/tracker.pl" --port "$MOG_TRACKER_PORT" \
	--store "http://127.0.0.1:$MOG_STORE_PORT" > "$WORK/tracker.log" 2>&1 &
MOG_TRACKER_PID=$!

# Wait for it, rather than hoping.  perl, because /dev/tcp is a bash
# extension and this runs under /bin/sh.
_mog_wait=0
while [ "$_mog_wait" -lt 50 ]; do
	perl -MIO::Socket::INET -e 'exit(IO::Socket::INET->new(
		PeerAddr => "127.0.0.1", PeerPort => $ARGV[0],
		Proto => "tcp", Timeout => 1) ? 0 : 1)' "$MOG_TRACKER_PORT" && break
	_mog_wait=$((_mog_wait + 1))
	sleep 0.1 2> /dev/null || sleep 1
done

reload_cleanup() {
	[ -n "${MOG_TRACKER_PID:-}" ] && kill "$MOG_TRACKER_PID" 2> /dev/null
	return 0
}

reload_probe() {
	curl -s --max-time 5 "http://127.0.0.1:$PORT/probe/one"
}
